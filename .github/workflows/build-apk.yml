name: Compilation de DiagnoTest.apk

# Se déclenche avec les étiquettes de version, comme build-exe.yml : les deux fichiers
# sont joints à la même release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Le SDK Android est préinstallé sur les runners Ubuntu de GitHub (variable ANDROID_HOME).

      # La clé de signature n'est jamais dans le dépôt : elle vient des secrets du dépôt.
      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets de signature absents : l'APK sera signé avec une clé de debug."
            exit 0
          fi
          # tr : tolère les fins de ligne Windows (secrets saisis depuis PowerShell)
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          cat > "$RUNNER_TEMP/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=diagnotest
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          echo "DIAGNOTEST_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
          echo "APK_SIGNED=true" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/DiagnoTest.apk"

      - name: Vérifier la signature et calculer l'empreinte
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs DiagnoTest.apk | head -n 3
          sha256sum DiagnoTest.apk | cut -d' ' -f1 > DiagnoTest.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DiagnoTest-android
          path: |
            DiagnoTest.apk
            DiagnoTest.apk.sha256

      # Un APK signé avec la clé de debug ne doit jamais être publié : sans secrets, il reste un artefact de test.
      - name: Joindre l'APK à la release
        if: startsWith(github.ref, 'refs/tags/') && env.APK_SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DiagnoTest.apk
            DiagnoTest.apk.sha256
